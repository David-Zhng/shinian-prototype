function preview(){const c=chapter();return shell(`<div class="row between" style="margin-bottom:20px"><div><div class="eyebrow">YOUR STORY, ON THE PAGE</div><h2>这一章，写好了</h2></div>${btn('编辑','preview-edit','secondary','pen')}</div><div class="template-bar" aria-label="排版模板">${[['classic','经典书页'],['letter','温暖信笺'],['modern','简洁文集']].map(([v,t])=>btn(t,`template:${v}`,c.template===v?'active':'')).join('')}</div>${bookHTML(c)}<div class="row wrap" style="margin-top:14px"><span class="demo-note">演示排版 · 标题可直接修改，正文保持您的表达</span></div><div class="page-actions">${btn('确认章节','confirm','primary','check')}</div>`,'章节预览')}
function confirmed(){return shell(`<div class="center"><div class="confirmed">${icon('check')}</div><div class="eyebrow">A MEMORY, KEPT</div><h1 style="margin-top:12px">这一页，留下了。</h1><p class="muted">《${esc(title(chapter()))}》已确认保存。<br>以后想起新的细节，还可以回来补充。</p></div><div class="page-actions">${btn('查看我的章节','nav:chapters','secondary')}${btn('分享给家人','share','primary','share')}</div><div class="share-card"><span class="eyebrow">原声与文字</span><p style="margin:10px 0 0">分享前，您可以选择章节，以及是否附带原声。</p></div>`,'章节已保存')}
function share(){const confirmed=state.chapters.filter(c=>c.status==='confirmed');return shell(`<div class="page-heading"><div class="eyebrow">A STORY TO SHARE</div><h1>把故事交给家人</h1><p>由您决定分享哪些章节。</p></div><div class="notice">原型分享仅在当前浏览器演示，不生成可供他人访问的分享链接。</div><section class="share-card"><h3>选择已确认章节</h3>${confirmed.map(c=>`<label class="switch-row"><span>${esc(title(c))}</span><input type="checkbox" name="share-chapter" value="${esc(c.id)}" checked></label>`).join('')||'<p>暂时还没有已确认的章节。</p>'}<label class="switch-row" style="border-top:1px solid #ddd"><span>一并分享原声<br><span class="small muted">目前只有演示讲述记录，没有真实音频</span></span><input id="share-audio" type="checkbox"></label></section><div class="page-actions">${btn(state.published?'更新分享内容（演示）':'确认分享（演示）','share-publish','primary','share',confirmed.length?'':'disabled')}</div>${state.published?btn('停止分享（演示）','share-stop','text-btn'):''}`,'分享回忆录')}
function reading(){const pub=state.published;return shell(`<div class="page-heading"><div class="eyebrow">THE STORIES WE INHERIT</div><h1>在故事里，<br>再认识一次家人。</h1><p>文字留下经历，阅读让我们靠近。</p></div>${pub?`<div class="notice">本机分享演示 · 阅读的是最近一次主动分享的版本。</div><div class="chapter-list">${pub.chapters.map((c,i)=>`<button class="chapter-row" data-action="read:${c.id}"><span class="chapter-no">${String(i+1).padStart(2,'0')}</span><div class="chapter-info"><h3>${esc(c.titleState==='removed'?`第${i+1}章`:c.title)}</h3><p>约${Math.max(1,Math.ceil(c.text.length/250))}分钟阅读${state.readerProgress[c.id]?' · 可继续上次的位置':''}</p></div>${icon('chevron')}</button>`).join('')}</div>`:`<div class="share-card"><h2>等待一份回忆录</h2><p style="margin-top:12px" class="muted">先在老人侧确认章节，再通过“分享给家人”进入阅读演示。</p>${btn('去选择分享章节','share','primary','book')}</div>`}<div class="tool-row">${btn('我的书签','bookmarks','secondary','bookmark')}${btn('私人批注','notes','secondary','pen')}</div>`,'家人阅读')}
function getRead(){return state.published?.chapters.find(c=>c.id===readerId)}
function reader(){const c=getRead();if(!c){page='reading';return reading()}return shell(`<div class="reader-toolbar">${btn('目录','nav:reading','','list')}${btn(state.bookmarks.some(b=>b.id===readerId)?'已加书签':'书签','bookmark','','bookmark')}${btn('概括','reader-summary','','spark')}${btn('批注','note-add','','pen')}${btn('字号','reader-font','')}</div>${readerSummaryOpen?`<div class="summary"><span class="eyebrow">AI 概括 · 演示摘录</span><p style="margin:8px 0 0">${esc(readerSummary||'正在整理……')}</p></div>`:''}${bookHTML(c,true)}${state.published.audio&&c.recordings?.length?`<div class="page-actions">${btn('听原声','audio-demo','secondary','headphones')}</div>`:''}<p class="bottom-note">阅读进度自动保存在本机 · 可选中文字添加私人批注</p>`,'阅读回忆录')}
function settings(){return shell(`<div class="page-heading"><div class="eyebrow">ABOUT THIS PROTOTYPE</div><h1>先体验，再慢慢完善。</h1></div><div class="settings-item"><h3>这是一份可交互原型</h3><p>输入、编辑、确认、模板切换、照片添加和本机保存可以真实操作。AI、语音识别、原声播放和跨设备分享尚未接入。</p></div><div class="settings-item"><h3>AI 功能预留好了位置</h3><p>提问、补文、差异检查、成文、章节名和阅读概括使用本地演示逻辑。自定义故事不会被发送到任何模型服务；演示不会自动润色或纠正您的经历。</p></div><div class="settings-item"><h3>只在当前设备保存</h3><p>清除浏览器数据后内容会丢失，不会跨设备同步。请先使用虚构故事测试，不把这份原型作为唯一的回忆录存档。</p></div><div class="settings-item"><h3>尝试一条完整流程</h3><p>打开“第一次离开家乡”，补充故事后点击“整理成篇”，体验示例中的年份差异，再选择模板、修改标题并确认章节。</p>${btn('体验示例故事','open:first','secondary')}</div><div class="settings-item"><h3>重新开始体验</h3><p>恢复两篇示例故事，会清除本机原型中的编辑、照片、书签和批注。</p>${btn('重置演示数据','reset','danger')}</div>`,'使用说明')}
function render(){const views={home,chapters,editor,qa,diff:diffView,preview,confirmed,share,reading,reader,settings,busy:()=>shell(`<div class="busy">${icon('spark')}<h2>把这段回忆，安放到纸上。</h2><p class="muted" style="margin-top:15px">正在处理演示内容，请稍候……</p></div>`,'整理故事')};$('#app').innerHTML=(views[page]||home)();bindInputs()}
function bindInputs(){const story=$('#story-text');if(story){story.addEventListener('focus',editLocal);story.addEventListener('input',()=>{const result=readStoryDOM(story);chapter().text=result.text;chapter().photos=result.photos;story.querySelectorAll('[data-photo-index]').forEach((n,i)=>n.dataset.photoIndex=i);changed();rememberCaret();$('#char-count').textContent=chapter().text.length+'字';$('#save-status').textContent=storageWarn?'本机保存失败，请减少照片':'已自动保存';const b=$('[data-action="compose"]');if(b)b.disabled=!chapter().text.trim()});story.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))})}$('#answer-input')?.addEventListener('input',e=>{chapter().answerDraft=e.target.value;chapter().editedAt=Date.now();touch()});if(page==='home')loadResumeSummary()}
async function loadResumeSummary(){const c=recentChapter(),text=c.text,request=++summaryRequest;if(!text.trim())return;try{const result=await memoirAI.summarize({story:text});if(page==='home'&&request===summaryRequest&&recentChapter().id===c.id&&$('#resume-summary'))$('#resume-summary').textContent=result.summary}catch{if(page==='home'&&request===summaryRequest&&$('#resume-summary'))$('#resume-summary').textContent='概括暂未准备好，您可以直接继续讲述。'}}
function readStoryDOM(root){let text='',photos=[];function walk(n){if(n.nodeType===3){text+=n.textContent;return}if(n.nodeType!==1&&n.nodeType!==11)return;if(n.nodeType===1&&n.hasAttribute('data-photo-index')){const p=chapter().photos[Number(n.getAttribute('data-photo-index'))];if(p)photos.push({...p,offset:text.length});return}if(n.nodeName==='BR'){text+='\n';return}const block=['DIV','P'].includes(n.nodeName);if(block&&text&&!text.endsWith('\n'))text+='\n';for(const child of n.childNodes)walk(child);if(block&&n.nextSibling&&!text.endsWith('\n'))text+='\n'}for(const n of root.childNodes)walk(n);return {text,photos}}
function rememberCaret(){const root=$('#story-text'),sel=window.getSelection();if(!root||!sel?.rangeCount||!root.contains(sel.focusNode))return;const range=document.createRange();range.selectNodeContents(root);range.setEnd(sel.focusNode,sel.focusOffset);caretOffset=readStoryDOM(range.cloneContents()).text.length}
document.addEventListener('selectionchange',rememberCaret);
function storyHTML(c,editable=false){if(!c.text&&!c.photos?.length)return '';let html='',start=0;const photos=(c.photos||[]).map((p,i)=>({...p,i,offset:Math.max(0,Math.min(c.text.length,p.offset??(p.position==='start'?0:c.text.length)))})).sort((a,b)=>a.offset-b.offset);for(const p of photos){html+=`<span>${esc(c.text.slice(start,p.offset))}</span><figure class="photo" ${editable?`contenteditable="false" data-photo-index="${p.i}"`:''}><img src="${p.data}" alt="${esc(p.caption||'回忆照片')}"><figcaption>${esc(p.caption)}</figcaption>${editable?btn('移除照片',`photo-remove:${p.i}`,'text-btn'):''}</figure>`;start=p.offset}return html+`<span>${esc(c.text.slice(start))}</span>`}
function openChapter(id){if(!state.chapters.some(c=>c.id===id)){toast('示例已不存在，可重置演示数据');return}currentId=id;caretOffset=chapter().text.length;state.lastChapter=id;persist();editReturn='home';highlight=false;mode='voice';navigate(chapter().status==='confirmed'?'preview':'editor')}
function newChapter(text=''){const id='c'+Date.now();state.chapters.push({id,title:'',titleState:'auto',text,status:'draft',template:'classic',photos:[],answers:[],answerDraft:'',recordings:[],history:[],updated:Date.now()});currentId=id;caretOffset=text.length;editReturn='home';mode='voice';touch();navigate('editor')}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const [a,arg]=el.dataset.action.split(':');try{switch(a){
case 'nav':navigate(arg);break;
case 'back':if(page==='busy')return;if(page==='qa'){navigate('editor')}else if(page==='diff'){composeBusy=false;navigate('editor')}else if(page==='reader')navigate('reading');else navigate('home');break;
case 'open':openChapter(arg);break;
case 'resume':openChapter(arg);editReturn='home';navigate('editor');break;
case 'resume-audio':currentId=arg;modal(`<h2>听上次录音</h2><p>上次讲述 ${formatTime(chapter().recordings.at(-1).seconds)}。目前为演示记录，尚未接入真实原声播放。</p><div class="dialog-actions">${btn('知道了','modal-close','secondary')}</div>`);break;
case 'new':newChapter();break;
case 'topic':modal(`<h2>从一个小片段开始</h2><p>话题建议为演示，选一个想聊的，或直接开始。</p><div class="plain-list">${['第一次领工资','母亲做的一道菜','一个让我记住的人'].map(x=>btn(x,`topic-pick:${x}`,'')).join('')}</div><div class="dialog-actions">${btn('先不选','modal-close','secondary')}${btn('直接写故事','new','primary')}</div>`);break;
case 'topic-pick':newChapter();chapter().title=arg;chapter().titleState='manual';touch();render();break;
case 'mode':if(arg===mode)return;if(recording||paused)recordStop(true);mode=arg;render();if(mode==='text')$('#story-input')?.focus();break;
case 'record-start':startRecord();break;
case 'record-stop':recordStop();render();break;
case 'silence':silenceWarning();break;
case 'silence-continue':clearTimeout(warningTimer);closeModal();scheduleSilence();toast('继续录音演示');break;
case 'silence-stop':clearTimeout(warningTimer);closeModal();recordStop();render();break;
case 'qa-start':await startQa();break;
case 'qa-submit':await submitAnswer();break;
case 'qa-skip':await submitAnswer(true);break;
case 'qa-more':roundEnd=chapter().answers.length+3;qaLoading=true;render();qaQuestion=(await memoirAI.nextQuestion({story:chapter().text,answers:chapter().answers})).question;qaLoading=false;render();break;
case 'qa-finish':await finishQa();break;
case 'qa-finish-submit':chapter().answers.push({question:qaQuestion,text:chapter().answerDraft.trim()});chapter().answerDraft='';touch();await finishQa(true);break;
case 'qa-exit':closeModal();navigate('editor');toast('未提交的回答已保留，可稍后继续');break;
case 'qa-voice':if(qaRecording){stopQa();render()}else{qaRecording=true;render();const words='我记得那天她一直站在车站门口，直到车开得看不见了。';let n=0;qaTimer=setInterval(()=>{if(n>=words.length){stopQa();render();return}chapter().answerDraft=(chapter().answerDraft||'')+words[n++];touch();if($('#answer-input'))$('#answer-input').value=chapter().answerDraft},100)}break;
case 'answer-edit':{const i=Number(arg);modal(`<h2>修改这条回答</h2><p>后续补文以您修改后的回答为准。</p><textarea id="answer-edit">${esc(chapter().answers[i].text)}</textarea><div class="dialog-actions">${btn('取消','modal-close','secondary')}${btn('确认修改',`answer-save:${i}`,'primary')}</div>`);break;}
case 'answer-save':chapter().answers[Number(arg)].text=$('#answer-edit').value;touch();closeModal();qaQuestion=(await memoirAI.nextQuestion({story:chapter().text,answers:chapter().answers})).question;render();toast('回答已更新');break;
case 'photo':addPhoto();break;
case 'photo-save':await savePhoto();break;
case 'photo-remove':snapshot();chapter().photos.splice(Number(arg),1);changed();render();toast('照片已移除');break;
case 'compose':await beginCompose();break;
case 'diff-skip':await nextDiff();break;
case 'diff-apply':snapshot();chapter().text=chapter().text.replace(diffs[diffIndex].from,diffs[diffIndex].suggested);changed();await nextDiff();toast('建议已应用到当前章节');break;
case 'diff-edit':composeBusy=false;editReturn='diff';navigate('editor');toast('直接修改原文，再点击整理成篇');break;
case 'diff-save':snapshot();chapter().text=$('#diff-input').value;changed();closeModal();await nextDiff();break;
case 'template':chapter().template=arg;changed();render();toast('排版已切换，正文未改变');break;
case 'preview-edit':editReturn='preview';mode='text';navigate('editor');break;
case 'return-preview':navigate('preview');break;
case 'title-edit':modal(`<h2>${chapter().titleState==='removed'?'添加章节名':'修改章节名'}</h2><label class="field-label" for="title-input">章节名</label><input id="title-input" type="text" maxlength="60" value="${esc(chapter().titleState==='removed'?'':chapter().title)}"><div class="dialog-actions">${btn('取消','modal-close','secondary')}${btn('确认','title-save','primary')}</div>`);$('#title-input')?.focus();break;
case 'title-save':{const t=$('#title-input').value.trim();if(!t){toast('请输入章节名；也可选择移除标题');return}snapshot();chapter().title=t;chapter().titleState='manual';changed();closeModal();render();break;}
case 'title-remove':snapshot();chapter().title='';chapter().titleState='removed';changed();render();toast('标题已移除，目录中以“第×章”显示');break;
case 'confirm':chapter().status='confirmed';touch();navigate('confirmed');break;
case 'share':navigate('share');break;
case 'share-publish':{const ids=[...document.querySelectorAll('[name="share-chapter"]:checked')].map(x=>x.value);if(!ids.length){toast('至少选择一个章节');return}state.published={chapters:structuredClone(state.chapters.filter(c=>ids.includes(c.id)&&c.status==='confirmed')),audio:$('#share-audio').checked,updated:Date.now()};persist();navigate('reading');toast('本机分享版本已更新');break;}
case 'share-stop':state.published=null;persist();navigate('reading');toast('本机分享已停止');break;
case 'read':readerId=arg;readerSummary='';readerSummaryOpen=false;navigate('reader');setTimeout(()=>window.scrollTo(0,state.readerProgress[arg]||0),50);break;
case 'bookmark':{const idx=state.bookmarks.findIndex(b=>b.id===readerId);if(idx>=0){state.bookmarks.splice(idx,1);toast('书签已移除')}else{state.bookmarks.push({id:readerId,title:getRead().title||'无标题章节',scroll:window.scrollY,text:getRead().text});toast('已添加书签')}persist();render();break;}
case 'reader-summary':readerSummaryOpen=!readerSummaryOpen;render();if(readerSummaryOpen){readerSummary=(await memoirAI.summarize({story:getRead().text})).summary;render()}break;
case 'reader-font':state.font=state.font>=1.35?1.05:(state.font||1.13)+.15;persist();render();break;
case 'note-add':{const selected=window.getSelection()?.toString()||'';modal(`<h2>写一条私人批注</h2><p>仅您自己可见，不修改家人的原文。</p><blockquote class="small">${esc(selected||getRead().text.slice(0,65))}</blockquote><textarea id="note-input" placeholder="读到这里，想起了什么？"></textarea><div class="dialog-actions">${btn('取消','modal-close','secondary')}${btn('保存批注','note-save','primary')}</div>`);modal.quote=selected||getRead().text.slice(0,65);break;}
case 'note-save':if(!$('#note-input').value.trim()){toast('先写一点想法再保存');return}state.notes.push({id:Date.now(),chapterId:readerId,quote:modal.quote,text:$('#note-input').value});persist();closeModal();toast('私人批注已保存');break;
case 'notes':modal(`<h2>我的私人批注</h2>${state.notes.length?state.notes.map(n=>`<div class="settings-item"><p>“${esc(n.quote)}”</p><div>${esc(n.text)}</div><p class="small">${state.published?.chapters.find(c=>c.id===n.chapterId)?.text.includes(n.quote)?'对应原文仍在':'对应内容已更新或停止分享'}</p>${btn('删除',`note-delete:${n.id}`,'text-btn')}</div>`).join(''):'<p>阅读时选中文字，留下您的感受。</p>'}<div class="dialog-actions">${btn('关闭','modal-close','secondary')}</div>`);break;
case 'note-delete':state.notes=state.notes.filter(n=>String(n.id)!==arg);persist();closeModal();toast('批注已删除');break;
case 'bookmarks':modal(`<h2>我的书签</h2>${state.bookmarks.length?state.bookmarks.map(b=>{const c=state.published?.chapters.find(c=>c.id===b.id);return `<div class="settings-item"><h3>${esc(b.title)}</h3><p>${!c?'对应内容已停止分享':c.text!==b.text?'内容已更新，将返回章节开头':'继续阅读这篇故事'}</p>${c?btn('打开',`bookmark-read:${b.id}`,'secondary'):''}${btn('移除',`bookmark-delete:${b.id}`,'text-btn')}</div>`}).join(''):'<p>还没有书签，阅读时可以添加。</p>'}<div class="dialog-actions">${btn('关闭','modal-close','secondary')}</div>`);break;
case 'bookmark-read':{const b=state.bookmarks.find(b=>b.id===arg);readerId=arg;const changed=state.published.chapters.find(c=>c.id===arg).text!==b.text;navigate('reader');setTimeout(()=>window.scrollTo(0,changed?0:b.scroll),50);break;}
case 'bookmark-delete':state.bookmarks=state.bookmarks.filter(b=>b.id!==arg);persist();closeModal();toast('书签已移除');break;
case 'recordings':modal(`<h2>讲述记录</h2><p>当前为语音交互演示，没有录制真实音频。后续接入后，可在这里回听原声。</p>${chapter().recordings.map((r,i)=>`<p>第${i+1}段 · ${formatTime(r.seconds)} · 演示记录</p>`).join('')}<div class="dialog-actions">${btn('知道了','modal-close','primary')}</div>`);break;
case 'audio-demo':modal(`<h2>听原声</h2><p>播放入口已预留。当前原型没有真实音频，后续接入录音服务后，可播放与文字对应的祖辈原声。</p><div class="dialog-actions">${btn('知道了','modal-close','primary')}</div>`);break;
case 'modal-close':closeModal();break;
case 'reset':modal(`<h2>重新开始体验？</h2><p>将清除当前设备中的原型数据，包括编辑、照片和私人批注，恢复两篇示例故事。</p><div class="dialog-actions">${btn('保留内容','modal-close','secondary')}${btn('确认重置','reset-confirm','danger')}</div>`);break;
case 'reset-confirm':recordStop(true);stopQa();state=seed();currentId='first';undo=null;persist();navigate('home');toast('已恢复示例故事');break;
}}catch(err){console.error(err);composeBusy=false;toast('这一步未完成，您的原稿已保留，请重试')}});
let scrollTimer;window.addEventListener('scroll',()=>{if(page!=='reader'||!readerId)return;clearTimeout(scrollTimer);const id=readerId,offset=window.scrollY;scrollTimer=setTimeout(()=>{state.readerProgress[id]=offset;persist()},250)},{passive:true});window.addEventListener('pagehide',()=>{recordStop(true);stopQa();persist()});
$('#modal').addEventListener('cancel',()=>{if($('#countdown')){clearTimeout(warningTimer);scheduleSilence()}});
persist();render();
// Optional WebMCP integration: same state as the visible prototype, no model service.
if(document.modelContext?.registerTool){const tools=[{name:'read_memoir_prototype',description:'Read local prototype chapters and current screen.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(input&&Object.keys(input).length)throw new Error('No arguments accepted');return {screen:page,chapters:state.chapters.map(c=>({id:c.id,title:title(c),status:c.status,text:c.text}))}}},{name:'open_memoir_chapter',description:'Open an existing local chapter in its editor or preview; does not confirm or share it.',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input.id!=='string'||Object.keys(input).some(k=>k!=='id')||!state.chapters.some(c=>c.id===input.id))throw new Error('Unknown chapter');openChapter(input.id);return {screen:page,id:input.id}}}];for(const t of tools){try{Promise.resolve(document.modelContext.registerTool(t)).catch(()=>{})}catch{}}}



})();</script></body></html>
